name: Verify

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node src/plinth/contract-docs.mjs check
      - name: Verify with the adopted Base agent-door runner
        # Runtime source and CLI are separate pins until this runner is released.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_archive="$RUNNER_TEMP/plinth-agent-base.tar.gz"
          base_source="$RUNNER_TEMP/plinth-agent-base"
          mkdir -p "$base_source"
          gh api repos/runeditrun/base/tarball/d555e789cffb744a9f83d76ebe42a2e3bdd7a055 > "$base_archive"
          tar -xzf "$base_archive" -C "$base_source" --strip-components=1
          node "$base_source/bin/rer.mjs" verify

  installed:
    name: Installed ${{ matrix.journey }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        journey: [invoice-corrections, cost-billing, settlements, meetings, portfolio, report-packets, bid-follow-up, satisfaction, plans]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Exercise emitted Worker and native sign-in at 1440 and 390
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/verify/installed.mjs ${{ matrix.journey }}
      - name: Exercise installed estimate comparisons and catalog review
        if: matrix.journey == 'portfolio'
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/verify/installed.mjs estimate-performance
      - name: Build the existing guides for the installed office journey
        if: matrix.journey == 'cost-billing'
        run: pnpm exec rer build --site
      - name: Exercise office keyboard, read and write recovery
        if: matrix.journey == 'cost-billing'
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/verify/installed.mjs office
      - name: Exercise installed signed change execution
        if: matrix.journey == 'cost-billing'
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/verify/installed.mjs signed-changes
      - name: Exercise installed owner follow-up rules
        if: matrix.journey == 'bid-follow-up'
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/verify/installed.mjs followup-rules
      - name: Exercise settlement script against the processor boundary
        if: matrix.journey == 'settlements'
        run: perl -e 'alarm 1200; exec @ARGV' -- node scripts/live-proof/settlement-sandbox.mjs "$RUNNER_TEMP/plinth-settlement" --provider-edge
      - name: Exercise native archive recovery comparison
        if: matrix.journey == 'plans'
        run: perl -e 'alarm 1200; exec @ARGV' -- node tests/journeys/recovery-reconciliation.mjs
      - name: Preserve installed journey screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-${{ matrix.journey }}
          path: artifacts/installed
          if-no-files-found: warn
      - name: Preserve settlement boundary receipt
        if: always() && matrix.journey == 'settlements'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settlement-provider-edge
          path: |
            ${{ runner.temp }}/plinth-settlement/*.json
            ${{ runner.temp }}/plinth-settlement/*.png
          if-no-files-found: warn
